<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharePoker - 扑克牌局查看器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .search-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .search-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .search-form {
            display: flex;
            gap: 15px;
            align-items: end;
        }

        .form-group {
            flex: 1;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .game-info {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 25px;
            margin-top: 20px;
        }

        .game-header {
            border-bottom: 2px solid #f8f9fa;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .game-header h3 {
            color: #333;
            font-size: 1.8em;
            margin-bottom: 5px;
        }

        .game-meta {
            color: #666;
            font-size: 0.9em;
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .player-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #e9ecef;
            transition: transform 0.2s ease;
        }

        .player-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .player-name {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #dee2e6;
        }

        .player-image {
            text-align: center;
            margin-bottom: 15px;
        }

        .player-image img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .player-time {
            font-size: 0.85em;
            color: #666;
            text-align: center;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h3 {
            margin-bottom: 10px;
            color: #333;
        }

        @media (max-width: 768px) {
            .search-form {
                flex-direction: column;
            }
            
            .players-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>🃏 SharePoker</h1>
                    <p>扑克牌局查看器 - 实时查看牌局信息</p>
                </div>
                <button onclick="logout()" style="background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px;">退出登录</button>
            </div>
        </div>

        <div class="content">
            <div class="search-section">
                <h2>🔍 查看牌局</h2>
                <div class="search-form">
                    <div class="form-group">
                        <label for="gameCode">牌局代码</label>
                        <input type="text" id="gameCode" placeholder="请输入牌局代码，例如: 123456">
                    </div>
                    <button class="btn" onclick="queryGame()">查看牌局</button>
                </div>
            </div>

            <div id="status" class="status" style="display: none;"></div>
            <div id="gameResult"></div>
        </div>
    </div>

    <script>
        // 检查登录状态
        function checkLogin() {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const loginTime = localStorage.getItem('loginTime');
            
            // 检查是否已登录且登录时间在24小时内
            if (!isLoggedIn || !loginTime) {
                redirectToLogin();
                return false;
            }
            
            const now = Date.now();
            const loginTimestamp = parseInt(loginTime);
            const hoursSinceLogin = (now - loginTimestamp) / (1000 * 60 * 60);
            
            if (hoursSinceLogin > 24) {
                // 登录已过期，清除登录状态
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('loginTime');
                redirectToLogin();
                return false;
            }
            
            return true;
        }
        
        // 重定向到登录页面
        function redirectToLogin() {
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';
            window.location.href = `login.html?redirect=${currentPage}`;
        }
        
        // 退出登录
        function logout() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('loginTime');
            redirectToLogin();
        }
        
        // 动态获取API基础URL
        const API_BASE = window.location.origin;

        // 检查服务器状态
        async function checkServerStatus() {
            try {
                const response = await fetch(`${API_BASE}/api/health`);
                if (response.ok) {
                    showStatus('✅ 服务器连接正常', 'success');
                } else {
                    showStatus('⚠️ 服务器响应异常', 'error');
                }
            } catch (error) {
                showStatus('❌ 无法连接到服务器，请确保服务正在运行', 'error');
            }
        }

        // 显示状态信息
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.style.display = 'block';
        }

        // 隐藏状态信息
        function hideStatus() {
            document.getElementById('status').style.display = 'none';
        }

        // 查询牌局信息
        async function queryGame() {
            const gameCode = document.getElementById('gameCode').value.trim();
            
            if (!gameCode) {
                showStatus('请输入牌局代码', 'error');
                return;
            }

            const resultDiv = document.getElementById('gameResult');
            resultDiv.innerHTML = '<div class="loading">正在查询牌局信息...</div>';

            try {
                const response = await fetch(`${API_BASE}/api/game/${gameCode}`);
                const result = await response.json();

                if (response.ok) {
                    displayGameInfo(result);
                    hideStatus();
                } else {
                    resultDiv.innerHTML = `
                        <div class="empty-state">
                            <h3>❌ 查询失败</h3>
                            <p>${result.error || '未知错误'}</p>
                        </div>
                    `;
                    showStatus('查询失败', 'error');
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="empty-state">
                        <h3>❌ 网络错误</h3>
                        <p>无法连接到服务器，请检查网络连接</p>
                    </div>
                `;
                showStatus('网络连接失败', 'error');
            }
        }

        // 显示牌局信息
        function displayGameInfo(game) {
            const resultDiv = document.getElementById('gameResult');
            
            if (!game.players || game.players.length === 0) {
                resultDiv.innerHTML = `
                    <div class="game-info">
                        <div class="game-header">
                            <h3>牌局: ${game.code}</h3>
                            <div class="game-meta">创建时间: ${formatTime(game.created_at)}</div>
                            <div style="margin-top: 15px;">
                                <button class="btn btn-danger" onclick="clearGame('${game.code}')" style="background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);">
                                    🗑️ 清理牌局
                                </button>
                            </div>
                        </div>
                        <div class="empty-state">
                            <h3>📭 暂无玩家</h3>
                            <p>该牌局还没有玩家上传手牌</p>
                        </div>
                    </div>
                `;
                return;
            }

            let playersHtml = '';
            game.players.forEach((player, index) => {
                playersHtml += `
                    <div class="player-card">
                        <div class="player-name">👤 ${player.username}</div>
                        ${player.hand_image ? `
                            <div class="player-image">
                                <img src="${player.hand_image}" alt="手牌图片" onerror="this.style.display='none'">
                            </div>
                        ` : `
                            <div class="player-image">
                                <div style="padding: 40px; color: #999; font-size: 0.9em;">
                                    暂无手牌图片
                                </div>
                            </div>
                        `}
                        <div class="player-time">上传时间: ${formatTime(player.uploaded_at)}</div>
                    </div>
                `;
            });

            resultDiv.innerHTML = `
                <div class="game-info">
                    <div class="game-header">
                        <h3>🎮 牌局: ${game.code}</h3>
                        <div class="game-meta">
                            创建时间: ${formatTime(game.created_at)} | 
                            玩家数量: ${game.players.length}人
                        </div>
                        <div style="margin-top: 15px;">
                            <button class="btn btn-danger" onclick="clearGame('${game.code}')" style="background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);">
                                🗑️ 清理牌局
                            </button>
                        </div>
                    </div>
                    <div class="players-grid">
                        ${playersHtml}
                    </div>
                </div>
            `;
        }

        // 格式化时间
        function formatTime(timeStr) {
            try {
                const date = new Date(timeStr);
                return date.toLocaleString('zh-CN', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
            } catch (error) {
                return timeStr;
            }
        }

        // 清理牌局
        async function clearGame(gameCode) {
            if (!confirm(`确定要清理牌局 ${gameCode} 吗？此操作不可撤销！`)) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/game/${gameCode}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showStatus('✅ 牌局清理成功', 'success');
                    // 清空牌局显示
                    document.getElementById('gameResult').innerHTML = '';
                    // 清空输入框
                    document.getElementById('gameCode').value = '';
                } else {
                    const result = await response.json();
                    showStatus(`❌ 清理失败: ${result.error || '未知错误'}`, 'error');
                }
            } catch (error) {
                showStatus('❌ 网络错误，清理失败', 'error');
            }
        }

        // 回车键查询
        document.getElementById('gameCode').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                queryGame();
            }
        });

        // 页面加载时检查登录状态和服务器状态
        window.onload = function() {
            // 首先检查登录状态
            if (!checkLogin()) {
                return;
            }
            
            checkServerStatus();
            // 设置默认牌局代码
            document.getElementById('gameCode').value = '123456';
        };
    </script>
</body>
</html>
